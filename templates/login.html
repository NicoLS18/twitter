{% extends 'base.html' %}
{% block concent %}
<h2>Login</h2>

{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}

<form method="post" action="/login">
    <label>Username:<br>
        <input type="text" name="username" required>
    </label>
    <br><br>
    <label>Password:<br>
        <input type="password" name="password" required>
    </label>
    <br><br>
    <button type="submit">Login</button>
</form>

<p>Don't have an account? <a href="/create_user">Sign up</a></p>
{% endblock %}
