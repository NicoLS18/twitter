{% extends 'base.html' %}
{% block concent %}
<h2>Home Page</h2>

<img src="/static/logo.svg" alt="Twitter Clone Logo">

{% for msg in messages %}
<div>
    <img src="https://robohash.org/{{ msg.username }}" width="40" style="vertical-align:middle; margin-right:8px;">
    <strong>{{ msg.username }}</strong> (age {{ msg.age }}) &mdash; {{ msg.created_at }}
    <p>{{ msg.message }}</p>
    <hr>
</div>
{% endfor %}
{% endblock %}
