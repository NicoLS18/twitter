{% extends 'base.html' %}
{% block concent %}
<h2>Home Page</h2>

<img src="/static/logo.svg" alt="Twitter Clone Logo">

{% for msg in messages %}
<div>
    <p><strong>{{ msg.username }}</strong> (age {{ msg.age }}) &mdash; {{ msg.created_at }}</p>
    <p>{{ msg.message }}</p>
    <hr>
</div>
{% endfor %}
{% endblock %}
